<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyroWatch</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3-3 5-3 9a3 3 0 0 0 6 0c0-1-.5-2-1-3 3 1 5 4 5 7a7 7 0 0 1-14 0c0-5 5-7 7-13z"/></svg>
    <span>PyroWatch</span>
  </div>
  <nav class="nav" role="tablist" aria-label="Views">
    <button role="tab" data-view="overview" class="active" aria-selected="true">Overview</button>
    <button role="tab" data-view="space" aria-selected="false">Space Intelligence</button>
    <button role="tab" data-view="analytics" aria-selected="false">Analytics &amp; Validation</button>
    <button role="tab" data-view="ai" aria-selected="false">AI Intelligence</button>
  </nav>
  <div class="data-status" id="data-status">…</div>
</header>

<div class="subbar">
  <div class="crumbs"><b id="view-title">Overview</b><span id="view-sub">Hazard map</span></div>
  <div class="seg" id="hazards" role="tablist" aria-label="Hazard"></div>
  <div class="mode">
    <div id="replay-wrap" hidden>
      <select id="preset" aria-label="Replay preset"></select>
      <input type="date" id="replay-date" aria-label="Replay date">
      <button id="reveal" class="btn" hidden>Reveal what happened</button>
    </div>
    <div class="seg">
      <button id="mode-live" class="active">Live</button>
      <button id="mode-replay">Replay</button>
    </div>
  </div>
</div>

<main class="stage" id="stage">
  <div id="map"></div>
  <div class="banner" id="banner" hidden></div>
  <div class="tools">
    <button id="zoom-in" aria-label="Zoom in">+</button>
    <button id="zoom-out" aria-label="Zoom out">−</button>
    <button id="layers-btn" aria-label="Layers" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>
    </button>
    <button id="locate-btn" aria-label="Use my location">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </div>
  <div class="layers-menu" id="layers-menu" hidden></div>
  <div class="legend" id="legend"></div>
  <aside class="sheet" id="sheet" hidden></aside>
  <div class="loading" id="loading" hidden><span class="spin"></span><span id="loading-text"></span></div>
</main>

<footer class="statusbar"><span id="foot-left"></span><span id="foot-mid"></span><span id="foot-right"></span></footer>
<div id="toast" role="status" hidden></div>
<div id="sr-status" class="sr" aria-live="polite"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/satellite.min.js"></script>
<script type="module" src="app/main.js"></script>
</body>
</html>
