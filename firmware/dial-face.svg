<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320mm" height="210mm">
  <!-- PyroWatch Beacon dial face (print, cut, mount to SG90 servo). LOW=left, EXTREME=right. -->
  <defs>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="35%" stop-color="#f9a825"/>
      <stop offset="65%" stop-color="#ef6c00"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
  </defs>
  <rect width="320" height="210" fill="#fffdf8"/>
  <text x="160" y="22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">PYROWATCH BEACON</text>
  <text x="160" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#444">FIRE DANGER LEVEL</text>
  <!-- arc -->
  <path d="M 40 165 A 120 120 0 0 1 280 165" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round"/>
  <!-- ticks: 5 levels across 180 degrees -->
  <g stroke="#333" stroke-width="2" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#111" text-anchor="middle">
    <!-- LOW at 180deg (left) -->
    <line x1="40" y1="165" x2="52" y2="165"/>
    <text x="40" y="182">LOW</text>
    <text x="40" y="192" font-size="8" fill="#555">0–19</text>
    <!-- MODERATE -->
    <line x1="75" y1="105" x2="83" y2="113"/>
    <text x="70" y="98">MODERATE</text>
    <text x="70" y="108" font-size="8" fill="#555">20–39</text>
    <!-- HIGH -->
    <line x1="160" y1="45" x2="160" y2="57"/>
    <text x="160" y="38">HIGH</text>
    <text x="160" y="48" font-size="8" fill="#555">40–59</text>
    <!-- VERY HIGH -->
    <line x1="245" y1="105" x2="237" y2="113"/>
    <text x="250" y="98">VERY HIGH</text>
    <text x="250" y="108" font-size="8" fill="#555">60–74</text>
    <!-- EXTREME -->
    <line x1="280" y1="165" x2="268" y2="165"/>
    <text x="280" y="182">EXTREME</text>
    <text x="280" y="192" font-size="8" fill="#555">75–100</text>
  </g>
  <!-- center pivot mark -->
  <circle cx="160" cy="165" r="5" fill="#222"/>
  <circle cx="160" cy="165" r="2" fill="#fff"/>
  <text x="160" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7" fill="#666">Mount at servo pivot (160,165). Pointer: 180°=LOW, 0°=EXTREME.</text>
</svg>
